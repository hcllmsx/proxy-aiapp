# 由 hcllmsx-github-release skill 生成 · 发布方案：形态 #3（单公开仓 + 网盘交付 + Actions 构建 + 对象存储中转）
name: Release

on:
  push:
    tags:
      - 'v*'
  # 手动触发：用于同一版本号重跑构建（例如修好打包内容后覆盖网盘里的旧包）。
  # 版本号默认取仓库的 VERSION 文件，留空即可。
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则使用仓库 VERSION 文件）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify Version Matches Tag
        id: verify
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $ver = (Get-Content -Raw -Encoding UTF8 "VERSION").Trim()
          if ($ver -notmatch '^\d+(\.\d+)+$') {
            throw "VERSION 内容不是合法版本号: $ver"
          }

          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            # 手动重跑：以输入版本号（若给了）或 VERSION 文件为准，不校验 tag
            if ($env:INPUT_VERSION) {
              $ver = $env:INPUT_VERSION.Trim()
              if ($ver -notmatch '^\d+(\.\d+)+$') {
                throw "输入的版本号不是合法版本号: $ver"
              }
            }
            $tag = "v$ver"
            Write-Host "手动触发模式：构建版本 $ver（tag $tag）"
          } else {
            $tagVer = $env:REF_NAME.TrimStart('v')
            if ($tagVer -ne $ver) {
              throw "Tag ($env:REF_NAME) 与 VERSION ($ver) 不一致，请先更新 VERSION 文件再打 tag。"
            }
            $tag = $env:REF_NAME
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$ver"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"

      - name: Build Release Notes
        env:
          VERSION: ${{ steps.verify.outputs.version }}
          REPO_NAME: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          $ver = $env:VERSION

          $notes = "Release v$ver"
          if (Test-Path "CHANGELOG.md") {
            $changelog = Get-Content -Raw -Encoding UTF8 "CHANGELOG.md"
            $esc = [regex]::Escape($ver)
            $pattern = '(?ms)^##\s+\[?v?' + $esc + '\]?.*?\r?\n(.*?)(?=^##\s+|\Z)'
            if ($changelog -match $pattern) {
              $extracted = $matches[1].Trim()
              if ($extracted) { $notes = $extracted }
            }
          }
          $notes = $notes -replace "`r`n", "`n"

          $repo = $env:REPO_NAME
          $base = "https://raw.githubusercontent.com/$repo/main/docs/media"
          $bodyLines = @(
            '### 更新内容',
            '',
            $notes,
            '',
            '---',
            '',
            '### 下载方式请扫描以下二维码',
            '',
            '> 抱歉以网盘形式发布，希望这是暂时的。转存至网盘能为我带来一点微薄收益以维持项目更新，感谢理解。指着这个吃饭是不够的，但每周能买一包泡面是可以的。万一如果有多的，那都用来充 TOKEN 啦。',
            '',
            '<p align="center">',
            "  <img src=`"$base/quark-proxy-aiapp.jpeg`" width=`"200`" alt=`"夸克网盘下载二维码`" />",
            '</p>',
            '',
            '扫码后转存并下载压缩包，解压后双击 `install.bat` 打开安装工具。'
          )
          $final = $bodyLines -join "`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "release_notes.txt"), $final,
            (New-Object System.Text.UTF8Encoding($false)))

      - name: Configure CMake (x64 Release)
        run: cmake -S . -B _temp/build-x64 -A x64 -DBUILD_TESTS=ON

      - name: Build Release
        run: cmake --build _temp/build-x64 --config Release --parallel

      - name: Run Unit Tests
        run: ctest --test-dir _temp/build-x64 -C Release --output-on-failure

      - name: Package Release ZIP
        env:
          RELEASE_VERSION: ${{ steps.verify.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $ver   = $env:RELEASE_VERSION
          $build = Join-Path $PWD "_temp/build-x64/Release"
          $stage = Join-Path $PWD "_temp/package_stage"
          $inner = Join-Path $stage "ProxyAiApp"
          $core  = Join-Path $inner "core"

          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $core -Force | Out-Null

          # 编译产物：代理本体 + Antigravity CLI shim + 商店应用启动器。
          # ProxyLauncher.exe 缺失时，商店版 WhatsApp / ChatGPT 装不了（包目录不可写），
          # 必须打进包里，否则用户装完才发现功能缺失。
          foreach ($dll in @("version.dll", "dbghelp.dll", "antigravity_proxy.dll")) {
            $src = Join-Path $build $dll
            if (-not (Test-Path $src)) { throw "缺少编译产物：$src" }
            Copy-Item $src (Join-Path $core $dll) -Force
          }
          $launcher = Join-Path $build "ProxyLauncher.exe"
          if (-not (Test-Path $launcher)) { throw "缺少编译产物：$launcher" }
          Copy-Item $launcher (Join-Path $core "ProxyLauncher.exe") -Force
          foreach ($f in @("config.json", "install.ps1")) {
            $src = Join-Path $PWD "core/$f"
            if (-not (Test-Path $src)) { throw "缺少文件：$src" }
            Copy-Item $src (Join-Path $core $f) -Force
          }
          foreach ($f in @("index.html", "install.bat", "README.md", "LICENSE", "VERSION")) {
            $src = Join-Path $PWD $f
            if (Test-Path $src) { Copy-Item $src (Join-Path $inner $f) -Force }
          }
          $assetsSrc = Join-Path $PWD "assets"
          if (Test-Path $assetsSrc) { Copy-Item $assetsSrc (Join-Path $inner "assets") -Recurse -Force }

          $out = Join-Path $PWD "out_put"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          $zip = Join-Path $out "Proxy-AiApp-v$ver-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $stage, $zip,
            [System.IO.Compression.CompressionLevel]::Optimal, $false)
          if (-not (Test-Path $zip)) { throw "打包失败：$zip" }
          $size = [math]::Round((Get-Item $zip).Length / 1MB, 2)
          Write-Host "打包完成：$zip ($size MB)"

      # 打包内容自检：少任何一项都不允许上传。
      # 之前 ProxyLauncher.exe 漏打，CI 照样「成功」，用户装完才发现商店应用代理不可用。
      - name: Verify Package Contents
        env:
          RELEASE_VERSION: ${{ steps.verify.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $PWD "out_put/Proxy-AiApp-v$($env:RELEASE_VERSION)-win-x64.zip"
          if (-not (Test-Path $zip)) { throw "找不到打包产物：$zip" }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            # Windows 下 ZipFile 用反斜杠做条目分隔符，统一成 / 再比对
            $names = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })

            $required = @(
              "ProxyAiApp/core/version.dll",
              "ProxyAiApp/core/dbghelp.dll",
              "ProxyAiApp/core/antigravity_proxy.dll",
              "ProxyAiApp/core/ProxyLauncher.exe",
              "ProxyAiApp/core/config.json",
              "ProxyAiApp/core/install.ps1",
              "ProxyAiApp/install.bat",
              "ProxyAiApp/index.html",
              "ProxyAiApp/VERSION",
              "ProxyAiApp/assets/img/WhatsApp.ico",
              "ProxyAiApp/assets/img/ChatGPT.ico"
            )
            $missing = @($required | Where-Object { $names -notcontains $_ })
            if ($missing.Count -gt 0) {
              Write-Host "发布包缺少以下必需文件："
              foreach ($m in $missing) { Write-Host "  - $m" }
              throw "发布包不完整，已中止上传。"
            }
            Write-Host "打包内容校验通过（$($names.Count) 个条目）"
          } finally {
            $archive.Dispose()
          }

      - name: Install rclone
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "rclone.zip"
          $dir = Join-Path $env:RUNNER_TEMP "rclone"
          Invoke-WebRequest -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem -Path $dir -Recurse -Filter "rclone.exe" | Select-Object -First 1
          if (-not $exe) { throw "解压后未找到 rclone.exe" }
          Add-Content -Path $env:GITHUB_PATH -Value $exe.DirectoryName
          & $exe.FullName version

      - name: Publish build to object storage (transfer staging)
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONF_B64 }}
          RCLONE_TARGET: ${{ secrets.RCLONE_TARGET }}
          RELEASE_VERSION: ${{ steps.verify.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:RCLONE_CONF_B64) { throw "缺少 Secret：RCLONE_CONF_B64" }
          if (-not $env:RCLONE_TARGET) { throw "缺少 Secret：RCLONE_TARGET" }
          $conf = Join-Path $env:RUNNER_TEMP "rclone.conf"
          [System.IO.File]::WriteAllBytes($conf, [System.Convert]::FromBase64String($env:RCLONE_CONF_B64))

          $name   = "Proxy-AiApp-v$($env:RELEASE_VERSION)-win-x64.zip"
          $src    = Join-Path $PWD "out_put/$name"
          if (-not (Test-Path $src)) { throw "找不到打包产物：$src" }
          $target = $env:RCLONE_TARGET.TrimEnd('/') + "/" + $name

          & rclone --config $conf copyto $src $target
          if ($LASTEXITCODE -ne 0) { throw "rclone copyto 上传失败" }
          & rclone --config $conf lsl $target
          if ($LASTEXITCODE -ne 0) { throw "rclone lsl 校验落地失败" }
          Write-Host "已上传中转：$target"

      - name: Create GitHub Release (Announcement Only)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.verify.outputs.tag }}
          name: 'Proxy-AiApp v${{ steps.verify.outputs.version }}'
          body_path: release_notes.txt
          draft: false
          prerelease: false
          generate_release_notes: false
