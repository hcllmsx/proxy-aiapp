# ============================================================
# 网盘分发 / 二维码引导发布工作流（免构建纯公告模式）
# 适用场景：
# - 发布包上传至夸克 / 百度网盘，不直接在 GitHub Release 挂载二进制文件
# - GitHub Release 仅作为「版本更新公告」与「网盘二维码下载引导入口」
# - 工作流不装任何工具链、不编译、不打包，runner 启动后数秒内完成发布
# - 发布包由本地开发菜单 [5] 编译并打包为 ZIP，手动上传网盘后再打 tag 发版
#
# 【重要】若要从本模式切回「GitHub 直接发布」（安装包挂载至 Release Assets）：
#   1. 必须整体删除网盘文案（致歉引用块、二维码区块、"扫描以下二维码"小节标题）——
#      读者并不知悉项目曾采用网盘分发，这些说明只会引发困惑。
#   2. 不要书写"安装包已直接挂在本次 Release 的 Assets 中，不再经由网盘中转"这类迁移提示。
#   3. 同时恢复真正的构建 / 打包步骤，并在 action-gh-release 中配置 `files:` 上传产物。
# ============================================================
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Verify Version Matches Tag
        id: verify
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          # VERSION 文件是全项目唯一版本号来源，必须与 tag 一致，否则
          # Release 标题与客户端展示的版本号会对不上。
          $ver = (Get-Content -Raw -Encoding UTF8 "VERSION").Trim()
          if ($ver -notmatch '^\d+(\.\d+)+$') {
            throw "VERSION 内容不是合法版本号: $ver"
          }
          $tagVer = $env:REF_NAME.TrimStart('v')
          if ($tagVer -ne $ver) {
            throw "Tag ($env:REF_NAME) 与 VERSION ($ver) 不一致，请先更新 VERSION 文件再打 tag。"
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$ver"

      - name: Build Release Notes
        shell: pwsh
        env:
          VERSION: ${{ steps.verify.outputs.version }}
          REPO_NAME: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          $ver = $env:VERSION

          # 从 CHANGELOG.md 提取当前版本的更新说明；缺失时退化为通用说明
          $notes = "Release v$ver"
          if (Test-Path "CHANGELOG.md") {
            $changelog = Get-Content -Raw -Encoding UTF8 "CHANGELOG.md"
            $esc = [regex]::Escape($ver)
            $pattern = '(?ms)^##\s+\[?v?' + $esc + '\]?.*?\r?\n(.*?)(?=^##\s+|\Z)'
            if ($changelog -match $pattern) {
              $extracted = $matches[1].Trim()
              if ($extracted) { $notes = $extracted }
            }
          }
          # CHANGELOG 为 CRLF，拼接用的是 LF，统一换行避免正文出现混合行尾
          $notes = $notes -replace "`r`n", "`n"

          # 二维码图片必须用完整绝对外链：Release 正文不支持仓库内相对路径。
          # 若 raw 地址在部分网络下不可达，可整体换成 jsDelivr 直链：
          #   https://cdn.jsdelivr.net/gh/<owner>/<repo>@main/docs/media/<file>
          # PowerShell here-string 的结束符若位于行首（列 0）会破坏 YAML 缩进，
          # 故统一采用数组拼接。
          #
          # 结构约定：'### 更新内容' 与独占一行的 '---' 之间只放日志正文，
          # 客户端据此解析展示内容，调整文案时不得破坏该结构。
          $repo = $env:REPO_NAME
          $base = "https://raw.githubusercontent.com/$repo/main/docs/media"
          $bodyLines = @(
            '### 更新内容',
            '',
            $notes,
            '',
            '---',
            '',
            '### 下载方式请扫描以下二维码',
            '',
            '> 抱歉以网盘形式发布，希望这是暂时的。转存至网盘能为我带来一点微薄收益以维持项目更新，感谢理解。指着这个吃饭是不够的，但每周能买一包泡面是可以的。万一如果有多的，那都用来充 TOKEN 啦。',
            '',
            '<p align="center">',
            "  <img src=`"$base/quark-proxy-aiapp.jpeg`" width=`"200`" alt=`"夸克网盘下载二维码`" />",
            '  &nbsp;&nbsp;&nbsp;&nbsp;',
            "  <img src=`"$base/baidu-proxy-aiapp.jpeg`" width=`"200`" alt=`"百度网盘下载二维码`" />",
            '</p>',
            '',
            '扫码后转存并下载压缩包，解压后双击 `install.bat` 打开安装工具。'
          )
          $final = $bodyLines -join "`n"
          # 不写 BOM：带 BOM 时 GitHub 会把首行 "### 更新内容" 当普通文本，标题不渲染
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD "release_notes.txt"), $final,
            (New-Object System.Text.UTF8Encoding($false)))

      - name: Create GitHub Release (Announcement Only)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          # 标题规范：<项目名> v<版本号>，不带 owner/ 前缀
          name: 'Proxy-AiApp v${{ steps.verify.outputs.version }}'
          body_path: release_notes.txt
          draft: false
          prerelease: false
          generate_release_notes: false
          # 纯公告模式：不配置 files:，发布页不挂任何二进制附件
